---
vector_config_files:
  - "{{ vector_config_path }}/*.toml"
  - "{{ vector_config_path }}/vector.yaml"
vector_config_template_path: "{{ playbook_dir }}/templates/"
vector_parser_config:
  - application:
    name: test
    parse_vrl: . = parse_grok!(.message, "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}")\n.new_field = "Value in fake
      field"\ndel(.level)\n.timestamp = to_timestamp!(.timestamp)
    path_log: /var/log/vector
vector_version: "0.57.0"
