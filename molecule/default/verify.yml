---
- name: Verify
  become: true
  hosts:
    - all
  tasks:
    - name: Download and install Goss
      ansible.builtin.get_url:
        checksum: "{{ goss_sha256sum }}"
        dest: "{{ goss_dst }}"
        mode: 493
        url: "{{ goss_url }}"
      register: download_goss
      retries: 3
      until: download_goss is succeeded
    - name: Copy Goss tests to remote
      ansible.builtin.template:
        dest: "{{ goss_test_directory }}/{{ item | basename }}"
        src: "{{ item }}"
        mode: "0644"
      with_fileglob:
        - tests/test_*.yml
    - name: Register test files
      register: test_files
      ansible.builtin.shell: ls {{ goss_test_directory }}/test_*.yml
      changed_when: false
    - name: Execute Goss tests
      ansible.builtin.command: "{{ goss_dst }} -g {{ item }} validate --format {{ goss_format }}"
      changed_when: false
      register: test_results
      with_items: "{{ test_files.stdout_lines }}"
    - name: Display details about the Goss results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      with_items: "{{ test_results.results }}"
    - name: Fail when tests fail
      ansible.builtin.fail:
        msg: Goss failed to validate
      when: item.rc != 0
      with_items: "{{ test_results.results }}"
  vars:
    goss_arch: amd64
    goss_dst: /usr/local/bin/goss
    goss_format: documentation
    goss_sha256sum: sha256:26c481073d346028451d56af600a71ec2d6c7bc960c3e207f610e32c5e1f5144
    goss_test_directory: /tmp
    goss_url: https://github.com/aelsabbahy/goss/releases/download/{{ goss_version }}/goss-linux-{{ goss_arch }}
    goss_version: v0.3.14
  vars_files:
    - ../../defaults/main.yml
